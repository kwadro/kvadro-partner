security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        app_admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        admin:
            pattern: ^/admin_9fg!lp
            lazy: true
            provider: app_admin_provider
            context: admin
            custom_authenticator: App\Security\AdminLoginFormAuthenticator
            logout:
                path: app_admin_logout
                target: app_admin_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                name: REMEMBERME_ADMIN
                remember_me_parameter: _remember_me

        main:
            lazy: true
            provider: app_user_provider
            context: main
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                name: REMEMBERME_USER
                remember_me_parameter: _remember_me

    access_control:
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET, POST, OPTIONS] }
        - { path: ^/admin_9fg!lp/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin_9fg!lp, roles: ROLE_ADMIN }
        - { path: ^/cabinet, roles: ROLE_USER }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
